[project]
name = "lead-engine"
version = "0.1.0"
description = "Finds local businesses without an effective web presence and qualifies them against real audience evidence."
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lead_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Postgres; deselect with `-m "not integration"`.
markers = ["integration: requires a live Postgres from docker compose"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
